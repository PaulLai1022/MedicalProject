version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8200:8200"
    volumes:
      - backend-data:/app/data
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
